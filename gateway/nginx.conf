# Internal gateway: the ONE port this stack exposes (8080 in the container).
# The outer (devops) nginx only proxies to it. Routing lives in
# templates/gateway.conf.template (upstreams come from env vars).
worker_processes auto;

events { worker_connections 1024; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Docker's embedded DNS. Upstreams are referenced through variables, so nginx
  # re-resolves them at runtime: a recreated container (new IP) is picked up
  # without restarting the gateway, and a missing service is a 502, not a crash.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # TLS terminates at the outer nginx: keep what it says, fall back to our own.
  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }
  map $http_x_forwarded_host  $fwd_host  { default $http_x_forwarded_host;  "" $http_host; }
  map $http_upgrade $connection_upgrade  { default upgrade; "" ""; }

  client_max_body_size 50m;          # nginx default is 1m
  proxy_http_version 1.1;            # websockets + keepalive
  proxy_set_header Host $http_host;  # keeps the port; Next's Server Action origin check compares it
  proxy_set_header X-Forwarded-Host $fwd_host;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;               # SSE + streamed responses go out as they're written
  proxy_request_buffering off;       # stream uploads instead of spooling them to disk
  # Internal network: a connect takes <1ms. A short timeout makes nginx move on
  # to the next replica fast when one just went away (default is 60s).
  proxy_connect_timeout 1s;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 3;
  proxy_read_timeout 300s;           # default 60s; SSE/WS also send heartbeats
  proxy_send_timeout 300s;

  include /etc/nginx/conf.d/*.conf;
}
