# TEST ONLY: stand-ins for the devops nginx, in front of the gateway.
#   docker compose -f docker-compose.yml -f docker-compose.outer-test.yml up -d
# Ports: 9081 = bare outer nginx, 9082 = typical outer nginx.
services:
  outer-bare:
    image: nginx:1.29-alpine
    volumes: ["./test/outer-nginx/bare.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:9081:80"]
    depends_on: [gateway]
  outer-typical:
    image: nginx:1.29-alpine
    volumes: ["./test/outer-nginx/typical.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:9082:80"]
    depends_on: [gateway]
